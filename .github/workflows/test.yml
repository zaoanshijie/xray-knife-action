name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  unit:
    name: unit (platform mapping + socks encoding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Syntax check
        run: |
          for file in src/index.js src/cleanup.js src/platform.js src/socks.js src/http-proxy.js; do
            node --check "$file"
          done
      - run: node test/assets.test.js
      - run: node test/socks.test.js

  install:
    name: install (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the three combinations this action supports and bundles
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: x64
    steps:
      - uses: actions/checkout@v5

      - name: Assert the runner architecture
        shell: bash
        run: |
          set -euo pipefail
          node -e "console.log('node reports', process.platform, process.arch)"
          test "$(node -p process.arch)" = "${{ matrix.arch }}"

      # A dead proxy makes any outbound HTTP call fail, so this step only passes
      # when the binary came from the repository's own vendor/ directory.
      # (Keep one spelling per variable: GitHub's workflow parser treats env
      # names case-insensitively and rejects HTTP_PROXY + http_proxy together.)
      - name: Install xray-knife (bundled, network blocked)
        id: xk
        uses: ./
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: socks5://127.0.0.1:9

      - name: Check the CLI is usable from PATH
        shell: bash
        run: |
          set -euo pipefail
          xray-knife --version
          echo "version output: ${{ steps.xk.outputs.version }}"
          test "${{ steps.xk.outputs.version }}" = "11.4.0"
          test -f "${{ steps.xk.outputs.xray-knife-path }}"
          xray-knife http --help > /dev/null
          xray-knife proxy inbound --help > /dev/null

      - name: Download path smoke test (best effort, needs GitHub releases)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        uses: ./
        with:
          version: latest

  e2e:
    name: end-to-end (local xray server)
    runs-on: ubuntu-latest
    # Pinned on purpose: the fixture is a stand-in for "some node that works",
    # not a test of Xray-core itself. Tracking "latest" made this job fail the
    # week v26.10.21 shipped, for a change that has nothing to do with us.
    # Bump it deliberately, then check the job still passes.
    env:
      XRAY_CORE_VERSION: v26.10.21
    steps:
      - uses: actions/checkout@v5

      - name: Start a local Xray server
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_CORE_VERSION}/Xray-linux-64.zip"
          mkdir -p /tmp/xray
          unzip -q -o /tmp/xray.zip -d /tmp/xray
          chmod +x /tmp/xray/xray
          # Xray-core >= v26.10.21 blackholes private destinations by default
          # when the inbound is vless/vmess/trojan/shadowsocks ("final rules",
          # SSRF protection): the tunnel establishes, then the reply never comes
          # back and every node test ends as http-timeout. The explicit allow
          # rule below is matched before that default block rule and keeps the
          # loopback fixture reachable.
          cat > /tmp/xray/server.json <<'EOF'
          {
            "log": { "loglevel": "warning" },
            "inbounds": [
              {
                "listen": "127.0.0.1",
                "port": 20000,
                "protocol": "vless",
                "settings": {
                  "clients": [{ "id": "b831381d-6324-4d53-ad4f-8cda48b30811" }],
                  "decryption": "none"
                }
              }
            ],
            "outbounds": [
              {
                "protocol": "freedom",
                "settings": {
                  "finalRules": [
                    { "action": "allow", "ip": ["127.0.0.0/8", "::1/128"] }
                  ]
                }
              }
            ]
          }
          EOF
          nohup /tmp/xray/xray run -c /tmp/xray/server.json > /tmp/xray/server.log 2>&1 &
          for _ in $(seq 1 20); do
            ss -ltn 2>/dev/null | grep -q ':20000 ' && break
            sleep 0.5
          done
          ss -ltn | grep ':20000 ' || { cat /tmp/xray/server.log; exit 1; }

      - name: Serve a subscription and a target page
        run: |
          set -euo pipefail
          node test/fixture-server.js 18080 20000 > /tmp/fixture.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18080/target.txt > /dev/null && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:18080/target.txt

      - name: Run the action
        id: xk
        uses: ./
        with:
          subscription: http://127.0.0.1:18080/sub.txt
          test-url: http://127.0.0.1:18080/target.txt
          port: 10809
          max-delay: 5000

      - name: Assert outputs
        run: |
          set -euo pipefail
          echo "version      = ${{ steps.xk.outputs.version }}"
          echo "total-nodes  = ${{ steps.xk.outputs.total-nodes }}"
          echo "valid-nodes  = ${{ steps.xk.outputs.valid-nodes }}"
          echo "http proxy   = ${{ steps.xk.outputs.proxy }}"
          echo "socks proxy  = ${{ steps.xk.outputs.socks-proxy }}"
          echo "pid          = ${{ steps.xk.outputs.pid }}"
          echo "relay pid    = ${{ steps.xk.outputs.relay-pid }}"
          test "${{ steps.xk.outputs.total-nodes }}" = "1"
          test "${{ steps.xk.outputs.valid-nodes }}" = "1"
          test "${{ steps.xk.outputs.proxy-available }}" = "true"
          test "${{ steps.xk.outputs.proxy }}" = "http://127.0.0.1:10809"
          test "${{ steps.xk.outputs.socks-proxy }}" = "socks5://127.0.0.1:10810"
          test -s "${{ steps.xk.outputs.valid-file }}"
          test -s "${{ steps.xk.outputs.log-file }}"
          test -s "${{ steps.xk.outputs.relay-log }}"

      - name: Use the HTTP proxy (plain http)
        run: |
          set -euo pipefail
          body=$(curl -fsS --noproxy "" --proxy "${{ steps.xk.outputs.proxy }}" http://127.0.0.1:18080/target.txt)
          echo "body: $body"
          echo "$body" | grep -q '^ok-through-the-tunnel GET /target.txt'

      - name: Use the HTTP proxy (POST body)
        run: |
          set -euo pipefail
          body=$(curl -fsS --noproxy "" --proxy "${{ steps.xk.outputs.proxy }}" -X POST -d 'ping=1' http://127.0.0.1:18080/echo)
          echo "body: $body"
          echo "$body" | grep -q '^ok-through-the-tunnel POST /echo body=6'

      - name: Use the HTTP proxy (https via CONNECT)
        run: |
          set -euo pipefail
          curl -fsS -m 30 --proxy "${{ steps.xk.outputs.proxy }}" https://api.ipify.org && echo

      - name: Use the SOCKS5 proxy
        run: |
          set -euo pipefail
          body=$(curl -fsS --noproxy "" --proxy "${{ steps.xk.outputs.socks-proxy }}" http://127.0.0.1:18080/target.txt)
          echo "body: $body"
          echo "$body" | grep -q '^ok-through-the-tunnel GET /target.txt'

      # git-proxy: the next steps must be able to clone without extra flags.
      - name: Instance that configures git
        id: xk-git
        uses: ./
        with:
          subscription: http://127.0.0.1:18080/sub.txt
          test-url: http://127.0.0.1:18080/target.txt
          port: 10840
          socks-port: 10841
          git-proxy: true

      - name: git is configured with the proxy
        run: |
          set -euo pipefail
          echo "http.proxy  = $(git config --global --get http.proxy)"
          echo "https.proxy = $(git config --global --get https.proxy)"
          echo "NO_PROXY    = ${NO_PROXY:-<unset>}"
          test "$(git config --global --get http.proxy)" = "http://127.0.0.1:10840"
          test "$(git config --global --get https.proxy)" = "http://127.0.0.1:10840"
          test "${{ steps.xk-git.outputs.git-proxy }}" = "http://127.0.0.1:10840"
          # git-proxy alone must still publish the loopback bypass list.
          echo "${NO_PROXY}" | grep -q '127.0.0.1'
          test "${{ steps.xk-git.outputs.no-proxy }}" = "localhost,127.0.0.1,::1"

      - name: git really goes through the proxy
        run: |
          set -euo pipefail
          GIT_TRACE_CURL=1 git ls-remote https://github.com/zaoanshijie/xray-knife-action HEAD 2>/tmp/git-trace.log
          echo "--- proxy lines in the trace:"
          grep -E "CONNECT github.com:443|port 10840" /tmp/git-trace.log | head -4
          # CONNECT to our relay, then a tunnel to github: the request did not go direct.
          grep -q "CONNECT github.com:443" /tmp/git-trace.log
          grep -q "port 10840" /tmp/git-trace.log

      # no-proxy: hosts listed there must skip the tunnel even though git is
      # configured to use it.
      - name: Instance that lets github.com bypass the proxy
        id: xk-bypass
        uses: ./
        with:
          subscription: http://127.0.0.1:18080/sub.txt
          test-url: http://127.0.0.1:18080/target.txt
          port: 10850
          socks-port: 10851
          git-proxy: true
          no-proxy: github.com, .internal.example

      - name: no-proxy hosts really bypass the proxy
        run: |
          set -euo pipefail
          echo "NO_PROXY = $NO_PROXY"
          echo "output   = ${{ steps.xk-bypass.outputs.no-proxy }}"
          test "${{ steps.xk-bypass.outputs.no-proxy }}" = "localhost,127.0.0.1,::1,github.com,.internal.example"
          test "$(git config --global --get http.proxy)" = "http://127.0.0.1:10850"
          GIT_TRACE_CURL=1 git ls-remote https://github.com/zaoanshijie/xray-knife-action HEAD 2>/tmp/bypass.log
          if grep -q "port 10850" /tmp/bypass.log; then
            echo "git used the proxy although github.com is in NO_PROXY"
            grep -E "port 10850|CONNECT" /tmp/bypass.log | head -5
            exit 1
          fi
          echo "no proxy hop for github.com, as configured"

      - name: Second instance that exports the proxy environment
        id: xk-env
        uses: ./
        with:
          subscription: http://127.0.0.1:18080/sub.txt
          test-url: http://127.0.0.1:18080/target.txt
          port: 10820
          socks-port: 10821
          export-env: true

      - name: The following steps inherit the proxy
        run: |
          set -euo pipefail
          if ! env | grep -qi '_proxy='; then
            echo "no proxy environment variable was exported"
            exit 1
          fi
          env | grep -i '_proxy=' | sort
          test -n "${HTTPS_PROXY:-}"
          test "${HTTPS_PROXY}" = "${{ steps.xk-env.outputs.proxy }}"
          test "${ALL_PROXY}" = "${{ steps.xk-env.outputs.socks-proxy }}"
          # NO_PROXY keeps loopback direct, so hit an external endpoint here.
          curl -fsS -m 30 https://api.ipify.org && echo

      # sing-box does not answer HTTP on its socks listener at all; this proves
      # the relay is what makes HTTP work, not the core.
      - name: sing-box core behind the same HTTP relay
        id: xk-singbox
        uses: ./
        with:
          subscription: http://127.0.0.1:18080/sub.txt
          test-url: http://127.0.0.1:18080/target.txt
          port: 10830
          socks-port: 10831
          core: sing-box

      - name: Use the sing-box backed HTTP proxy
        run: |
          set -euo pipefail
          body=$(curl -fsS --noproxy "" --proxy "${{ steps.xk-singbox.outputs.proxy }}" http://127.0.0.1:18080/target.txt)
          echo "body: $body"
          echo "$body" | grep -q '^ok-through-the-tunnel GET /target.txt'
          curl -fsS -m 30 --proxy "${{ steps.xk-singbox.outputs.proxy }}" https://api.ipify.org && echo

      # A failed node test is silent on the fixture side, so dump the server
      # log to make the next "0 of 1 configs passed" self-explanatory.
      - name: Show the local Xray server log after a failure
        if: failure()
        run: |
          echo "--- /tmp/xray/server.log ---"
          tail -n 50 /tmp/xray/server.log || true
          echo "--- /tmp/fixture.log ---"
          tail -n 20 /tmp/fixture.log || true

  # Runs your own subscription when the repository has a SUBSCRIPTION_URL
  # secret. Trigger it manually from the Actions tab.
  real-subscription:
    name: real subscription
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    env:
      SUBSCRIPTION_URL: ${{ secrets.SUBSCRIPTION_URL }}
    steps:
      - name: Explain how to enable this job
        if: env.SUBSCRIPTION_URL == ''
        run: |
          echo "::notice::Add a SUBSCRIPTION_URL secret to run this job against a real subscription."

      - uses: actions/checkout@v5
        if: env.SUBSCRIPTION_URL != ''

      - name: Import the subscription and start the proxy
        id: net
        if: env.SUBSCRIPTION_URL != ''
        uses: ./
        with:
          subscription: ${{ env.SUBSCRIPTION_URL }}
          max-passed: 5
          max-delay: 5000

      - name: Show the egress IP through the proxy
        if: env.SUBSCRIPTION_URL != ''
        run: |
          set -euo pipefail
          echo "working nodes: ${{ steps.net.outputs.valid-nodes }} / ${{ steps.net.outputs.total-nodes }}"
          curl -fsS -m 30 -x "${{ steps.net.outputs.proxy }}" https://api.ipify.org && echo
